<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="ipc-mrx-title ipc-mrx-desc">
  <title id="ipc-mrx-title">Hướng dẫn E2E chế độ Đối chiếu nguyên liệu</title>
  <desc id="ipc-mrx-desc">Quy trình năm giai đoạn từ chuẩn bị nguồn, đóng băng lô, Kho xuất theo ngày, Quản lý đối chiếu đến hoàn tất, kèm cách xử lý nguồn chưa sẵn sàng, xuất thiếu và xuất vượt.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#64748b" /></marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#2563eb" /></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#15803d" /></marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b45309" /></marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#be123c" /></marker>
    <style>

      .title { font: 700 34px 'Noto Serif', serif; fill: #0f172a; }
      .subtitle { font: 400 15px 'Noto Sans', sans-serif; fill: #475569; }
      .phase { font: 700 12px 'Geist Mono', monospace; fill: #2563eb; }
      .role { font: 700 11px 'Noto Sans', sans-serif; letter-spacing: .04em; }
      .node-title { font: 700 17px 'Noto Sans', sans-serif; fill: #0f172a; }
      .body { font: 400 12px 'Noto Sans', sans-serif; fill: #334155; }
      .action { font: 600 12px 'Noto Sans', sans-serif; fill: #0f172a; }
      .tech { font: 600 11px 'Geist Mono', monospace; fill: #475569; }
      .connector-label { font: 600 11px 'Noto Sans', sans-serif; fill: #475569; }
      .case-title { font: 700 14px 'Noto Sans', sans-serif; fill: #0f172a; }
      .case-copy { font: 400 12px 'Noto Sans', sans-serif; fill: #334155; }

  <rect width="1600" height="900" fill="#f8fafc" />
  <text x="48" y="40" class="eyebrow">IPCMANAGEMENT · HƯỚNG DẪN KHÁCH HÀNG</text>
  <text x="48" y="82" class="title">Chế độ “Đối chiếu nguyên liệu” — Quy trình E2E</text>
  <text x="48" y="110" class="subtitle">Thực hiện theo năm giai đoạn; mỗi vai trò chỉ thao tác phần việc được phân quyền.</text>
  <text x="1552" y="40" text-anchor="end" class="eyebrow">SOURCE: material-reconciliation.md · LIVE UI</text>

  <!-- Main lifecycle connectors -->
  <path d="M320 292 H360" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)" />
  <path d="M620 292 H660" fill="none" stroke="#2563eb" stroke-width="2.8" marker-end="url(#arrow-blue)" />
  <path d="M920 292 H960" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)" />
  <path d="M1220 292 H1260" fill="none" stroke="#15803d" stroke-width="2.8" marker-end="url(#arrow-green)" />

  <!-- Case branches: separate vertical routes, no return-line clutter -->
  <path d="M490 410 V438 H380 V470" fill="none" stroke="#b45309" stroke-width="2.3" marker-end="url(#arrow-amber)" />
  <path d="M750 410 V438 H800 V470" fill="none" stroke="#b45309" stroke-width="2.3" marker-end="url(#arrow-amber)" />
  <path d="M1090 410 V438 H1220 V470" fill="none" stroke="#be123c" stroke-width="2.3" marker-end="url(#arrow-red)" />

  <!-- Stage 1 -->
  <g>
    <rect x="60" y="170" width="260" height="240" rx="10" fill="#ffffff" stroke="#cbd5e1" />
    <rect x="78" y="188" width="84" height="24" rx="4" fill="#eef2ff" stroke="#a5b4fc" />
    <text x="120" y="205" text-anchor="middle" class="role" fill="#4338ca">ĐIỀU PHỐI</text>
    <text x="78" y="238" class="phase">GIAI ĐOẠN 01</text>
    <text x="78" y="266" class="node-title">Bắt đầu &amp; chọn tuần</text>
    <circle cx="92" cy="300" r="11" fill="#4f46e5" /><text x="92" y="304" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#fff">1</text>
    <text x="112" y="298" class="body"><tspan x="112">Đăng nhập; kiểm tra chế độ</tspan><tspan x="112" dy="1.35em">“Đối chiếu nguyên liệu”.</tspan></text>
    <circle cx="92" cy="342" r="11" fill="#4f46e5" /><text x="92" y="346" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#fff">2</text>
    <text x="112" y="346" class="body">Mở “Thực đơn tuần”.</text>
    <circle cx="92" cy="378" r="11" fill="#4f46e5" /><text x="92" y="382" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#fff">3</text>
    <text x="112" y="376" class="body"><tspan x="112">Chọn khách hàng/tuần;</tspan><tspan x="112" dy="1.35em">kiểm tra món, định mức, số suất.</tspan></text>
  </g>

  <!-- Stage 2 -->
  <g>
    <rect x="360" y="170" width="260" height="240" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" />
    <rect x="378" y="188" width="84" height="24" rx="4" fill="#ffffff" stroke="#a5b4fc" />
    <text x="420" y="205" text-anchor="middle" class="role" fill="#4338ca">ĐIỀU PHỐI</text>
    <text x="378" y="238" class="phase">GIAI ĐOẠN 02</text>
    <text x="378" y="266" class="node-title">Xem trước &amp; khóa lô</text>
    <circle cx="392" cy="300" r="11" fill="#4f46e5" /><text x="392" y="304" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#fff">1</text>
    <text x="412" y="304" class="body">Mở “Định lượng xuất kho”.</text>
    <circle cx="392" cy="336" r="11" fill="#4f46e5" /><text x="392" y="340" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#fff">2</text>
    <text x="412" y="340" class="body">Bấm “Kiểm tra nguồn”.</text>
    <circle cx="392" cy="372" r="11" fill="#4f46e5" /><text x="392" y="376" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#fff">3</text>
    <text x="412" y="370" class="body"><tspan x="412">Tạo lô → “Xác nhận khóa”</tspan><tspan x="412" dy="1.35em">→ “Chuyển sang Kho”.</tspan></text>
    <text x="378" y="400" class="tech">DRAFT → READY → TRANSFERRED</text>
  </g>

  <!-- Stage 3 -->
  <g>
    <rect x="660" y="170" width="260" height="240" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5" />
    <rect x="678" y="188" width="76" height="24" rx="4" fill="#ffffff" stroke="#67e8f9" />
    <text x="716" y="205" text-anchor="middle" class="role" fill="#0e7490">THỦ KHO</text>
    <text x="678" y="238" class="phase">GIAI ĐOẠN 03</text>
    <text x="678" y="266" class="node-title">Xuất thực tế theo ngày</text>
    <circle cx="692" cy="300" r="11" fill="#0891b2" /><text x="692" y="304" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#fff">1</text>
    <text x="712" y="304" class="body">Chọn đúng lô và một ngày.</text>
    <circle cx="692" cy="336" r="11" fill="#0891b2" /><text x="692" y="340" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#fff">2</text>
    <text x="712" y="340" class="body">Nhập thực xuất cho mọi dòng.</text>
    <circle cx="692" cy="372" r="11" fill="#0891b2" /><text x="692" y="376" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#fff">3</text>
    <text x="712" y="370" class="body"><tspan x="712">Kiểm tra số lượng rồi bấm</tspan><tspan x="712" dy="1.35em">“Xác nhận ngày …”.</tspan></text>
    <text x="678" y="400" class="tech">IN_PROGRESS · “CẢ TUẦN” CHỈ ĐỂ XEM</text>
  </g>

  <!-- Stage 4 -->
  <g>
    <rect x="960" y="170" width="260" height="240" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" />
    <rect x="978" y="188" width="78" height="24" rx="4" fill="#ffffff" stroke="#fdba74" />
    <text x="1017" y="205" text-anchor="middle" class="role" fill="#9a3412">QUẢN LÝ</text>
    <text x="978" y="238" class="phase">GIAI ĐOẠN 04</text>
    <text x="978" y="266" class="node-title">Đối chiếu từng dòng</text>
    <circle cx="992" cy="300" r="11" fill="#ea580c" /><text x="992" y="304" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#fff">1</text>
    <text x="1012" y="304" class="body">Mở menu “Đối chiếu”.</text>
    <circle cx="992" cy="336" r="11" fill="#ea580c" /><text x="992" y="340" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#fff">2</text>
    <text x="1012" y="334" class="body"><tspan x="1012">Chọn lô; xem “Cần xuất” và</tspan><tspan x="1012" dy="1.35em">“Thực tế đã xuất”.</tspan></text>
    <circle cx="992" cy="380" r="11" fill="#ea580c" /><text x="992" y="384" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#fff">3</text>
    <text x="1012" y="378" class="body"><tspan x="1012">Mở dòng “Cần xử lý”</tspan><tspan x="1012" dy="1.35em">và lưu kết luận.</tspan></text>
  </g>

  <!-- Stage 5 -->
  <g>
    <rect x="1260" y="170" width="280" height="240" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2" />
    <rect x="1278" y="188" width="78" height="24" rx="4" fill="#ffffff" stroke="#86efac" />
    <text x="1317" y="205" text-anchor="middle" class="role" fill="#166534">QUẢN LÝ</text>
    <text x="1278" y="238" class="phase">GIAI ĐOẠN 05</text>
    <text x="1278" y="266" class="node-title">Xác nhận hoàn tất</text>
    <circle cx="1292" cy="300" r="11" fill="#15803d" /><text x="1292" y="304" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#fff">1</text>
    <text x="1312" y="298" class="body"><tspan x="1312">Kiểm tra không còn dòng</tspan><tspan x="1312" dy="1.35em">“Cần xử lý”.</tspan></text>
    <circle cx="1292" cy="344" r="11" fill="#15803d" /><text x="1292" y="348" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#fff">2</text>
    <text x="1312" y="348" class="body">Bấm “Hoàn tất đối chiếu”.</text>
    <circle cx="1292" cy="380" r="11" fill="#15803d" /><text x="1292" y="384" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#fff">3</text>
    <text x="1312" y="378" class="body"><tspan x="1312">Bấm “Tải lại dữ liệu”</tspan><tspan x="1312" dy="1.35em">→ “Xác nhận hoàn tất”.</tspan></text>
  </g>

  <!-- Cases: numbered instructions for first-time users -->
  <g>
    <rect x="180" y="470" width="400" height="194" rx="10" fill="#fffbeb" stroke="#f59e0b" />
    <text x="202" y="502" class="case-title">CASE A · Nguồn chưa sẵn sàng</text>
    <circle cx="216" cy="536" r="12" fill="#b45309" /><text x="216" y="540" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="238" y="534" class="case-copy"><tspan x="238">Đọc cảnh báo: thiếu dữ liệu</tspan><tspan x="238" dy="1.35em">hay bản xem trước đã cũ.</tspan></text>
    <circle cx="216" cy="570" r="12" fill="#b45309" /><text x="216" y="574" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="238" y="568" class="case-copy"><tspan x="238">Nếu thiếu: mở “Thực đơn tuần”, bổ sung định mức (BOM)</tspan><tspan x="238" dy="1.35em">hoặc số suất rồi lưu.</tspan></text>
    <circle cx="216" cy="614" r="12" fill="#b45309" /><text x="216" y="618" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="238" y="612" class="case-copy"><tspan x="238">Quay lại “Định lượng xuất kho”, bấm “Kiểm tra lại nguồn”;</tspan><tspan x="238" dy="1.35em">hết cảnh báo mới tạo và khóa lô.</tspan></text>
    <text x="202" y="650" class="case-action" fill="#a16207">Kết quả: lô chuyển sang trạng thái sẵn sàng.</text>
  </g>

  <g>
    <rect x="600" y="470" width="400" height="194" rx="10" fill="#fffbeb" stroke="#f59e0b" />
    <text x="622" y="502" class="case-title">CASE B · Xuất thiếu</text>
    <circle cx="636" cy="536" r="12" fill="#b45309" /><text x="636" y="540" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="658" y="540" class="case-copy">Tại Kho, chọn đúng lô và ngày có nhãn “Đã xuất thiếu”.</text>
    <circle cx="636" cy="570" r="12" fill="#b45309" /><text x="636" y="574" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="658" y="574" class="case-copy">Bấm “Xuất phần còn thiếu”.</text>
    <circle cx="636" cy="604" r="12" fill="#b45309" /><text x="636" y="608" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="658" y="602" class="case-copy"><tspan x="658">Kiểm tra số lượng được điền, nhập lý do nếu cần,</tspan><tspan x="658" dy="1.35em">sau đó xác nhận tạo phiếu xuất bổ sung.</tspan></text>
    <text x="622" y="650" class="case-action" fill="#a16207">Kết quả: số đã xuất được cộng dồn vào đúng dòng/ngày.</text>
  </g>

  <g>
    <rect x="1020" y="470" width="400" height="194" rx="10" fill="#fff1f2" stroke="#f43f5e" />
    <text x="1042" y="502" class="case-title">CASE C · Xuất vượt</text>
    <circle cx="1056" cy="536" r="12" fill="#be123c" /><text x="1056" y="540" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="1078" y="540" class="case-copy">Thủ kho nhập lý do xuất vượt trước khi xác nhận phiếu.</text>
    <circle cx="1056" cy="570" r="12" fill="#be123c" /><text x="1056" y="574" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="1078" y="574" class="case-copy">Quản lý mở “Đối chiếu” và chọn dòng “Cần xử lý”.</text>
    <circle cx="1056" cy="604" r="12" fill="#be123c" /><text x="1056" y="608" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="1078" y="602" class="case-copy"><tspan x="1078">Bấm “Xử lý chênh lệch”, chọn nhóm xử lý, nhập lý do</tspan><tspan x="1078" dy="1.35em">và lưu kết luận.</tspan></text>
    <text x="1042" y="650" class="case-action" fill="#be123c">Kết quả: dòng đủ điều kiện để hoàn tất lô.</text>
  </g>

  <!-- Customer handoff notes -->
  <rect x="60" y="704" width="1480" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1" />
  <text x="84" y="736" class="note-title">Điểm cần nhớ trước khi thao tác</text>
  <text x="84" y="766" class="case-copy"><tspan font-weight="700">Đúng đủ:</tspan><tspan> Thủ kho có thể dùng “Điền đủ ngày”, kiểm tra rồi xác nhận.</tspan></text>
  <text x="84" y="792" class="case-copy"><tspan font-weight="700">Bếp trưởng:</tspan><tspan> chỉ xem/tải “Phiếu nấu”; không xem số xuất kho hay chênh lệch.</tspan></text>
  <text x="820" y="766" class="case-copy"><tspan font-weight="700">Đúng quyền:</tspan><tspan> nút ngoài thẩm quyền sẽ không hiển thị; không thao tác thay vai trò khác.</tspan></text>
  <text x="820" y="792" class="case-copy"><tspan font-weight="700">Kết quả cuối:</tspan><tspan> thanh tiến trình hiển thị “Hoàn tất”; mở lại vẫn thấy đúng lô và trạng thái.</tspan></text>

  <line x1="60" y1="850" x2="1540" y2="850" stroke="#cbd5e1" />
  <text x="60" y="878" class="footer">VIETNAMESE-FIRST · ROLE AUTHORITY · ORTHOGONAL CONNECTORS · ZERO OVERLAP</text>
