name: Verify

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    # The full unit suite includes native PowerShell evidence-tool contracts.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Shared fast quality gates
        run: npm run verify:quick
      - name: Architecture growth (advisory)
        continue-on-error: true
        env:
          EVENT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE_REF="$EVENT_BASE_REF"
          if [ -z "$BASE_REF" ] || [[ "$BASE_REF" =~ ^0+$ ]] || ! git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
            BASE_REF="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi
          node scripts/check-architecture-growth.mjs --strict --base-ref "$BASE_REF"
      - name: Lint frontend
        run: npm run lint:fe
      - name: Frontend dependency rules (existing baseline may only shrink)
        run: npm run depcruise:fe
      - name: Build frontend before bundle/source-ownership checks
        run: npm run build:fe
      - name: Route budgets (advisory)
        continue-on-error: true
        run: npm run check:route-budgets -w frontend
      - name: Frontend unit tests and JUnit report
        run: npm run test:fe:unit -- --maxWorkers=2 --reporter=default --reporter=junit --outputFile="${{ github.workspace }}/.artifacts/test-results/frontend-unit.xml"
      - name: Frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: .artifacts/test-results/frontend-unit.xml
          retention-days: 7
          if-no-files-found: warn

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456789
          MYSQL_DATABASE: ipcmanagement_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456789"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      # All credentials below belong only to this ephemeral CI service.
      ConnectionStrings__DefaultConnection: server=127.0.0.1;port=3306;database=ipcmanagement_ci;user=root;password=123456789;
      IPC_TEST_CONNECTION_STRING: server=127.0.0.1;port=3306;database=ipcmanagement_ci;user=root;password=123456789;
      MYSQL_PWD: "123456789"
      TEST_RESULTS_DIR: ${{ github.workspace }}/.artifacts/test-results
      JwtSettings__SecretKey: CI_VERIFY_SECRET_KEY_1234567890_ABCDEF
      JwtSettings__Issuer: IPCManagementAPI
      JwtSettings__Audience: IPCManagementClient
      JwtSettings__ExpiryMinutes: 30
      JwtSettings__RefreshExpiryDays: 1
      JwtSettings__MaxActiveRefreshTokens: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages (no lockfiles required by this cache)
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/*.slnx', 'dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Backend npm entrypoints use built-ins/dotnet and the pinned OpenAPI npx tool;
      # frontend workspace dependencies are installed only by the frontend job.
      - name: Restore backend solution
        run: dotnet restore backend/IPCManagement.slnx
      - name: Build API, test projects and database tool once
        run: dotnet build backend/IPCManagement.slnx --no-restore
      - name: Check generated API contract (separate Release build)
        run: npm run check:api-contract
      - name: Verify deterministic Phase 05 Golden fixtures
        run: npm run test:phase05-fixture-determinism
      - name: Install EF Core CLI matching the current provider
        run: dotnet tool install --tool-path ./.dotnet-tools dotnet-ef --version 9.0.23 --allow-roll-forward
      - name: Check EF migration snapshot
        run: >-
          ./.dotnet-tools/dotnet-ef migrations has-pending-model-changes
          --project backend/src/IPCManagement.Api/IPCManagement.Api.csproj
          --startup-project backend/src/IPCManagement.Api/IPCManagement.Api.csproj
          --msbuildprojectextensionspath .artifacts/dotnet/obj/IPCManagement.Api
          --no-build
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Generate model schema
        run: |
          mkdir -p .artifacts
          ./.dotnet-tools/dotnet-ef dbcontext script \
            --project backend/src/IPCManagement.Api/IPCManagement.Api.csproj \
            --startup-project backend/src/IPCManagement.Api/IPCManagement.Api.csproj \
            --msbuildprojectextensionspath .artifacts/dotnet/obj/IPCManagement.Api \
            --output .artifacts/ipc-schema.sql --no-build
      - name: Apply model schema to ephemeral integration database
        run: |
          mysql -h 127.0.0.1 -uroot -e "DROP DATABASE IF EXISTS ipcmanagement_ci; CREATE DATABASE ipcmanagement_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h 127.0.0.1 -uroot ipcmanagement_ci < .artifacts/ipc-schema.sql
          mysql -h 127.0.0.1 -uroot -e "SELECT COUNT(*) AS created_tables FROM information_schema.tables WHERE table_schema = 'ipcmanagement_ci';"
      - name: Backend core (integration/evidence/recovery retain separate ownership)
        run: >-
          npm run test:be:ci -- --no-build --no-restore
          --logger trx
          --results-directory "${{ github.workspace }}/.artifacts/test-results/backend"
      - name: Integration tests on MySQL
        id: integration
        env:
          # CI preloads the model schema above. Development startup would replay
          # migrations over those tables. Migration replay is tested separately below.
          ASPNETCORE_ENVIRONMENT: Testing
        run: >-
          dotnet test backend/tests/IPCManagement.Api.Tests/IPCManagement.Api.Tests.csproj
          --no-build --no-restore
          --filter "FullyQualifiedName~IPCManagement.Api.Tests.Integration&Category!=EvidenceOwned"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory "${{ env.TEST_RESULTS_DIR }}"
      - name: Validate integration execution evidence
        if: always() && steps.integration.outcome != 'skipped' && steps.integration.outcome != ''
        run: >-
          python3 scripts/ci_test_results.py --trx "${{ env.TEST_RESULTS_DIR }}/integration-tests.trx"
          --expected Auth_Menu_Demand_Issue_Report_Lifecycle_Should_Run_EndToEnd
      # Fresh entrypoint also invokes PurchaseHistory proof. Do not select both:
      # concurrent DROP/CREATE of lane8 would race. Preserve sequential DB phases.
      - name: Fresh migration replay
        id: migration_replay
        env:
          IPC_RUN_MYSQL_MIGRATION_TESTS: "1"
        run: >-
          dotnet test backend/tests/IPCManagement.Api.Tests/IPCManagement.Api.Tests.csproj
          --no-build --no-restore
          --filter "FullyQualifiedName~Migration_fresh_install_applies_decision_exception_and_legacy_marker_schema"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=migration-replay.trx"
          --results-directory "${{ env.TEST_RESULTS_DIR }}"
      - name: Validate fresh replay execution evidence
        if: always() && steps.migration_replay.outcome != 'skipped' && steps.migration_replay.outcome != ''
        run: >-
          python3 scripts/ci_test_results.py --trx "${{ env.TEST_RESULTS_DIR }}/migration-replay.trx"
          --expected Migration_fresh_install_applies_decision_exception_and_legacy_marker_schema
      - name: Populated upgrade replay (separate lane8/lane9 fixtures)
        id: migration_upgrade
        env:
          IPC_RUN_MYSQL_MIGRATION_TESTS: "1"
        run: >-
          dotnet test backend/tests/IPCManagement.Api.Tests/IPCManagement.Api.Tests.csproj
          --no-build --no-restore
          --filter "FullyQualifiedName~Migration_upgrade_populated_clone_preserves_receipt_history|FullyQualifiedName~Migration_upgrade_preserves_supplier_snapshots_and_rejects_duplicate_purchase_order_keys"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=migration-upgrade-replay.trx"
          --results-directory "${{ env.TEST_RESULTS_DIR }}"
      - name: Validate both upgrade cases executed
        if: always() && steps.migration_upgrade.outcome != 'skipped' && steps.migration_upgrade.outcome != ''
        run: >-
          python3 scripts/ci_test_results.py --trx "${{ env.TEST_RESULTS_DIR }}/migration-upgrade-replay.trx"
          --expected Migration_upgrade_populated_clone_preserves_receipt_history
          --expected Migration_upgrade_preserves_supplier_snapshots_and_rejects_duplicate_purchase_order_keys
      - name: Compare migration and model schema (nonempty evidence required)
        run: |
          mysql -h 127.0.0.1 -uroot -e "DROP DATABASE IF EXISTS ipcmanagement_model_ci; CREATE DATABASE ipcmanagement_model_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h 127.0.0.1 -uroot ipcmanagement_model_ci < .artifacts/ipc-schema.sql
          python3 scripts/ci_schema_parity.py
      - name: Backend test and schema diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            .artifacts/test-results/**/*.trx
            .artifacts/shape-*.txt
          retention-days: 7
          if-no-files-found: warn

  # Native Windows contracts cannot be executed by the MySQL Linux runner.
  # They remain a required gate; no category/allowlist padding or skipped tests.
  windows-contracts:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/*.slnx', 'dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: dotnet restore backend/tests/IPCManagement.Api.Tests/IPCManagement.Api.Tests.csproj
      - run: dotnet build backend/tests/IPCManagement.Api.Tests/IPCManagement.Api.Tests.csproj --no-restore
      - name: Windows PowerShell contracts (temporary adapters, no real database)
        id: contracts
        run: npm run test:be:windows -- --no-build --no-restore --logger "trx;LogFileName=windows-contracts.trx" --results-directory "${{ github.workspace }}/.artifacts/test-results"
      - name: Validate Windows contract execution
        if: always() && steps.contracts.outcome != 'skipped' && steps.contracts.outcome != ''
        run: >-
          python scripts/ci_test_results.py --trx "${{ github.workspace }}/.artifacts/test-results/windows-contracts.trx"
          --expected Checked_process_drains_both_pipes_without_waiting_for_child_exit
          --expected Recovery_script_should_require_provider_object_identity_and_live_lock_metadata
      - name: Windows test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-contract-results
          path: .artifacts/test-results/windows-contracts.trx
          retention-days: 7
          if-no-files-found: warn

  # Keep the original check name required by existing branch rules.
  verify:
    needs: [frontend, backend, windows-contracts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require every execution job to succeed
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          WINDOWS_RESULT: ${{ needs['windows-contracts'].result }}
        run: node scripts/check-ci-job-results.mjs
